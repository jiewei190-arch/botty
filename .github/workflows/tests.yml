name: tests

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          ALPACA_API_KEY: ''
          ALPACA_SECRET_KEY: ''
        run: python -m pytest -q
