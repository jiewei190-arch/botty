name: patch cloud automation status

on:
  push:
    branches:
      - fix/cloud-automation-status
    paths:
      - scripts/patch_cloud_status.py
      - .github/workflows/patch-cloud-status.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cloud-automation-status
      - name: Apply integration patch
        run: python scripts/patch_cloud_status.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading_bot/config/settings.py trading_bot/main.py trading_bot/dashboard/app.py
          git diff --cached --quiet || git commit -m "Wire dashboard to cloud automation worker"
          git push
