name: apply swing patch

on:
  push:
    branches:
      - fix/swing-backtest-plumbing
    paths:
      - scripts/apply_swing_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/swing-backtest-plumbing

      - name: Apply deterministic patch
        run: python scripts/apply_swing_patch.py

      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading_bot/backtesting/engine.py trading_bot/dashboard/app.py
          git commit -m "Wire swing backtest diagnostics and controls"
          git push origin HEAD:fix/swing-backtest-plumbing
