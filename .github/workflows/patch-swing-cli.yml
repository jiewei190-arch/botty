name: patch swing cli defaults

on:
  push:
    branches:
      - fix/swing-backtest-plumbing
    paths:
      - scripts/patch_swing_cli_defaults.py
      - .github/workflows/patch-swing-cli.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/swing-backtest-plumbing
      - name: Apply CLI defaults
        run: python scripts/patch_swing_cli_defaults.py
      - name: Commit patched CLI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading_bot/main.py
          git diff --cached --quiet || git commit -m "Default automated hunts to swing quality"
          git push
