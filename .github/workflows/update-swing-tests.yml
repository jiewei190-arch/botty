name: update swing tests

on:
  push:
    branches:
      - fix/swing-backtest-plumbing
    paths:
      - scripts/update_swing_tests.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/swing-backtest-plumbing
      - name: Update stale tests
        run: python scripts/update_swing_tests.py
      - name: Commit test updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_risk_manager.py tests/test_strategies.py
          git commit -m "Update legacy tests for swing defaults"
          git push origin HEAD:fix/swing-backtest-plumbing
